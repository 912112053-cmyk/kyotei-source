<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2b28">
<meta name="color-scheme" content="light dark">
<title>共テ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="AppIcon1024.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bar:#2b2b28; --bar-tx:#f2f0e9;
    --accent:#8c2f2f; --accent-soft:#f3e6e3;
    --bg:#efe9dc; --card:#fffdf8; --ink:#26241f; --mut:#6d6a61; --line:#d8d2c2;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1b18; --card:#26261f; --ink:#ece8db; --mut:#a49f8f; --line:#3d3a30; --accent-soft:#3a2624; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;}
  #appbar{background:var(--bar);color:var(--bar-tx);display:flex;align-items:center;gap:10px;
    padding:10px 16px;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #appbar img{width:30px;height:30px;border-radius:7px}
  #appbar[hidden]{display:none}
  #appbar .apptitle{font-size:19px;font-weight:600;letter-spacing:.12em}
  #appbar .appsub{font-size:11.5px;opacity:.72}
  main{max-width:860px;margin:0 auto;padding:20px 14px 80px}
  h2{font-size:18px;margin:4px 0 14px;letter-spacing:.04em}
  .muted{color:var(--mut);font-size:12.5px;line-height:1.7}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-family:inherit;font-size:13.5px;font-weight:500;padding:8px 16px;border-radius:6px;cursor:pointer}
  .btn:hover{filter:brightness(1.05)}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:#a12626;border-color:#c9a3a3}
  .btn.small{padding:5px 11px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:var(--bar-tx)}
  .exam-card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .exam-card .etitle{font-size:16.5px;font-weight:600;margin:0 0 4px;word-break:break-all}
  .exam-card .emeta{font-size:12.5px;color:var(--mut);margin:0 0 3px}
  .exam-card .ediag{font-size:12px;color:var(--mut);margin:0 0 12px}
  .exam-card .erow{display:flex;gap:8px;flex-wrap:wrap}
  .fld{display:block;margin:0 0 18px}
  .fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .fld input[type=text]{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);
    border-radius:6px;background:var(--card);color:var(--ink)}
  .filebtn{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--mut);border-radius:6px;
    padding:10px 14px;cursor:pointer;font-size:13.5px;background:var(--card);max-width:100%}
  .filebtn .fname{color:var(--mut);font-size:12.5px;word-break:break-all}
  .visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
  #view-solve{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#fff}
  #view-solve[hidden]{display:none}
  .solvebar{background:var(--bar);color:var(--bar-tx);display:flex;align-items:center;gap:12px;
    padding:8px 12px;flex:none}
  .solvebar .stitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #solveFrame{flex:1;border:0;width:100%;background:#fff}
  #progressOverlay{position:fixed;inset:0;z-index:60;background:rgba(15,14,12,.55);
    display:flex;align-items:center;justify-content:center;padding:20px}
  #progressOverlay[hidden]{display:none}
  .pcard{background:var(--card);color:var(--ink);border-radius:12px;padding:28px 30px;text-align:center;
    min-width:240px;box-shadow:0 16px 44px rgba(0,0,0,.4)}
  .spinner{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
    border:4px solid var(--line);border-top-color:var(--accent);animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #progStage{font-size:15px;font-weight:600}
  .keyrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line)}
  .keyrow .kno{width:52px;flex:none;font-weight:600}
  .keyrow select,.keyrow input[type=number]{font:inherit;font-size:14px;padding:6px 8px;
    border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink)}
  .keyrow input[type=number]{width:76px}
  .keyrow label{font-size:12px;color:var(--mut)}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#2b2b28;color:#f2f0e9;font-size:13.5px;padding:10px 20px;border-radius:6px;opacity:0;
    pointer-events:none;transition:.3s;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .err{color:#a12626;font-size:13px;line-height:1.7;white-space:pre-wrap}
</style>
</head>
<body>

<header id="appbar">
  <img src="icon-192.png" alt="">
  <span class="apptitle">共テ</span>
  <span class="appsub">模試PDFを、タップで解ける形に</span>
</header>

<main id="mainArea">
  <!-- ライブラリ -->
  <section id="view-library" class="view">
    <div class="row-between">
      <h2>ライブラリ</h2>
      <button class="btn solid" id="btnNew">模試を取り込む</button>
    </div>
    <div id="examList"></div>
    <p id="emptyMsg" class="muted">まだ模試がありません。「模試を取り込む」から問題PDFを追加してください。</p>
  </section>

  <!-- 取り込み -->
  <section id="view-import" class="view" hidden>
    <h2>模試を取り込む</h2>
    <label class="fld"><span>タイトル</span>
      <input type="text" id="impTitle" placeholder="模試の名前">
    </label>
    <div class="fld"><span>問題PDF（必須）</span>
      <label class="filebtn"><input type="file" id="impQ" accept="application/pdf" class="visually-hidden"><span>PDFを選ぶ</span><span class="fname" id="impQName"></span></label>
    </div>
    <div class="fld"><span>解答PDF（任意）</span>
      <label class="filebtn"><input type="file" id="impA" accept="application/pdf" class="visually-hidden"><span>PDFを選ぶ</span><span class="fname" id="impAName"></span></label>
      <button class="btn small" id="impAClear" hidden>解答PDFを外す</button>
      <p class="muted">解答PDFがない場合は、あとから「正解を編集」で手入力できます。</p>
    </div>
    <p class="err" id="impError"></p>
    <div class="row">
      <button class="btn" id="impCancel">キャンセル</button>
      <button class="btn solid" id="impStart">取り込む</button>
    </div>
    <p class="muted">変換はすべてこの端末の中（ブラウザ内）で行われます。PDFが外部サーバーに送信されることはありません。初回は読み取り用のデータ取得で通信が発生します。</p>
  </section>

  <!-- 正解・配点の編集 -->
  <section id="view-keyedit" class="view" hidden>
    <h2>正解・配点の編集</h2>
    <p class="muted" id="keyEditTitle"></p>
    <div id="keyRows"></div>
    <div class="row">
      <button class="btn" id="keyCancel">キャンセル</button>
      <button class="btn solid" id="keySave">保存して再生成</button>
    </div>
  </section>
</main>

<!-- 解く画面 -->
<section id="view-solve" hidden>
  <div class="solvebar">
    <button class="btn ghost small" id="solveBack">← 戻る</button>
    <span class="stitle" id="solveTitle"></span>
  </div>
  <iframe id="solveFrame" title="問題"></iframe>
</section>

<!-- 変換プログレス -->
<div id="progressOverlay" hidden>
  <div class="pcard">
    <div class="spinner"></div>
    <div id="progStage">変換中…</div>
    <div id="progPage" class="muted"></div>
  </div>
</div>

<div id="toast"></div>

<!-- ===== 生成HTML用 CSS テンプレート（Swift版 Detection.swift の htmlCSS を移植） ===== -->
<script type="text/plain" id="gen-css">
:root{
  --desk:#c9c6bd; --desk2:#e3e0d7;
  --bar:#2b2b28; --bar-tx:#f2f0e9;
  --accent:#8c2f2f; --accent-soft:#f3e6e3;
  --ok:#1d6b45; --ok-bg:#e4efe7; --ng:#a12626; --ng-bg:#f7e5e3;
  --flag:#b07d10; --flag-bg:#faf0d7;
  --line:#33312d; --mut:#6d6a61;
}
@media (prefers-color-scheme: dark){
  :root{ --desk:#161614; --desk2:#1e1e1b; --bar:#101010; --accent:#d98a80; --accent-soft:#3a2624; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,var(--desk2),var(--desk));font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;color:#1a1a1a;min-height:100vh}
.bar{position:sticky;top:0;z-index:50;background:var(--bar);color:var(--bar-tx);box-shadow:0 2px 10px rgba(0,0,0,.35)}
#barToggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:70;display:none;background:var(--bar);color:var(--bar-tx);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-size:12px;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.3)}
body.bar-hidden .bar{display:none}
body.bar-hidden #barToggle{display:block}
.bar-in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 14px;flex-wrap:wrap}
.bar .ttl{font-family:"Hiragino Mincho ProN","YuMincho","Noto Serif JP",serif;font-weight:500;font-size:15px;letter-spacing:.05em}
.bar .sub{font-size:11px;opacity:.75}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500;font-size:17px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:3px;letter-spacing:.06em}
.prog{font-size:12px;opacity:.92;font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--bar-tx);font-family:inherit;font-size:13px;font-weight:500;padding:6px 14px;border-radius:3px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.solid:hover{filter:brightness(1.18)}
.btn:disabled{opacity:.45;cursor:default}
.navrow{max-width:920px;margin:0 auto;display:flex;gap:6px;padding:0 14px 10px;flex-wrap:wrap}
.navrow button{appearance:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:var(--bar-tx);font-family:inherit;font-size:12px;padding:4px 11px;border-radius:999px;cursor:pointer}
.navrow button:hover{background:rgba(255,255,255,.16)}
main{max-width:920px;margin:0 auto;padding:26px 10px 70px}
.sheet{position:relative;background:#fff;color:#161513;margin:0 auto 30px;max-width:760px;
  padding:64px 12.4% 72px 13.2%;
  box-shadow:0 1px 2px rgba(0,0,0,.22),0 10px 30px rgba(0,0,0,.25);
  font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","MS PMincho","Noto Serif JP",serif;
  font-weight:400;font-size:14px;line-height:1.95;text-align:justify}
.sheet .runhead{position:absolute;top:26px;left:13.2%;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.06em}
.sheet .pgno{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-size:11.5px;color:#161513}
.bigtitle{text-align:center;margin:16px 0 8px}
.bigtitle h1{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-weight:500;font-size:23px;letter-spacing:.16em;margin:0 0 10px}
.bigtitle .rng{font-size:14.5px}
.goth{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-weight:500}
p{margin:0 0 8px}
.q{margin:0 0 24px;scroll-margin-top:120px}
.qstem{margin:0 0 6px}
.qno{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-weight:500}
.ansbox{display:inline-flex;align-items:center;justify-content:center;min-width:23px;height:23px;border:1.4px solid var(--line);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-weight:500;font-size:13px;padding:0 2px;background:#fff;vertical-align:baseline;margin-left:.4em}
.ansbox.filled{background:#2b2b28;color:#fff}
.flagbtn{float:right;appearance:none;border:1px solid #b6b1a4;background:#fff;color:#7a766a;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-size:11px;padding:2px 9px;border-radius:999px;cursor:pointer;margin-top:4px}
.flagbtn.on{background:var(--flag-bg);border-color:var(--flag);color:var(--flag)}
.choices{margin:8px 0 0;padding:0;list-style:none}
.choices li{margin:0 0 4px}
.choices button{display:flex;gap:9px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:3px;padding:4px 8px;font:inherit;color:inherit;cursor:pointer;line-height:1.8;align-items:baseline}
.choices button:hover{border-color:#c4bfb0;background:#fbfaf5}
.choices .mk{flex:none;font-size:14.5px;transform:translateY(1px)}
.choices button.sel{background:var(--accent-soft);border-color:var(--accent)}
body.done .choices button{cursor:default}
body.done .choices button.correct{background:var(--ok-bg);border-color:var(--ok)}
body.done .choices button.wrong{background:var(--ng-bg);border-color:var(--ng)}
.expl{display:none;margin-top:10px;border-top:1px dashed #8f8b80;padding-top:8px;font-size:13px;line-height:1.85}
body.done .expl{display:block}
.expl .verdict{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-weight:500;font-size:12.5px;margin-bottom:3px}
.expl .verdict.ok{color:var(--ok)} .expl .verdict.ng{color:var(--ng)} .expl .verdict.un{color:var(--mut)}
.fig{margin:12px 0 16px;text-align:center}
.fig img{max-width:100%;height:auto}
.overlay{position:fixed;inset:0;background:rgba(15,14,12,.62);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:26px 12px;overflow:auto}
.overlay.open{display:flex}
.panel{background:#fff;color:#161513;max-width:660px;width:100%;padding:26px 28px 30px;box-shadow:0 18px 50px rgba(0,0,0,.4);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
.panel h2{font-family:"Hiragino Mincho ProN","YuMincho","Noto Serif JP",serif;font-weight:500;font-size:20px;margin:0 0 8px;letter-spacing:.05em}
.panel .big{font-size:38px;font-weight:500;font-variant-numeric:tabular-nums}
.panel .big small{font-size:15px;color:var(--mut)}
.grid32{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:16px 0}
.grid32 button{position:relative;appearance:none;border:1.1px solid #8a867c;background:#fff;font-family:inherit;padding:5px 0;cursor:pointer;font-size:11px;line-height:1.45;border-radius:2px;color:#161513}
.grid32 button b{display:block;font-size:14px;font-weight:500}
.grid32 button.empty{color:#b3afa2}
.grid32 button.answered{border-color:var(--accent);background:var(--accent-soft)}
.grid32 button.flagged{box-shadow:inset 0 0 0 2px var(--flag)}
.grid32 button.ok{background:var(--ok-bg);border-color:var(--ok)}
.grid32 button.ng{background:var(--ng-bg);border-color:var(--ng)}
.breakdown{font-size:13.5px;line-height:2;border-top:1px solid #ccc;margin-top:12px;padding-top:10px}
.breakdown .rowline{display:flex;justify-content:space-between;border-bottom:1px dotted #d8d4c8;cursor:pointer}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.panel .row .btn{border-color:#8a867c;color:#161513}
.panel .row .btn.solid{color:#fff;border-color:var(--accent)}
.panel .warnlist{font-size:13.5px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2b28;color:#f2f0e9;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-size:13.5px;padding:10px 20px;border-radius:3px;opacity:0;pointer-events:none;transition:.3s;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:680px){
  .sheet{padding:52px 8% 60px 9%;font-size:13.4px}
  .sheet .runhead{left:9%}
  .bigtitle h1{font-size:18px}
  .grid32{grid-template-columns:repeat(4,1fr)}
  .bar .sub{display:none}
}
</script>

<!-- ===== 生成HTML用 JS テンプレート（Swift版 htmlScript を移植。保存は localStorage、出力は共有/コピー） ===== -->
<script type="text/plain" id="gen-js">
var TITLE = __TITLE__;
var TOTAL = __TOTAL__;
var ANS = {__ANS__};
var PTS = {__PTS__};
var EXPL = {};
var SKEY = __STORAGE_KEY__;
var MARKS = ["","①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
var answers = {}, flags = {}, graded = false;

/* ---------- progress persistence (localStorage, per exam) ---------- */
function saveState(){
  try{ localStorage.setItem(SKEY, JSON.stringify({a:answers, f:flags, e:elapsed, g:graded})); }catch(err){}
}
function loadState(){
  var s = null;
  try{ s = JSON.parse(localStorage.getItem(SKEY) || "null"); }catch(err){}
  if(!s) return;
  answers = s.a || {}; flags = s.f || {}; elapsed = s.e || 0;
  document.querySelectorAll(".choices").forEach(function(ul){
    var q = parseInt(ul.getAttribute("data-q"),10);
    ul.querySelectorAll("button").forEach(function(b){
      if(answers[q] === parseInt(b.getAttribute("data-v"),10)) b.classList.add("sel");
    });
  });
  document.querySelectorAll(".flagbtn").forEach(function(b){
    var n = parseInt(b.getAttribute("data-flag"),10);
    if(flags[n]){ b.classList.add("on"); b.textContent = "見直し中"; }
  });
  if(s.g){ window.__silentGrade = true; doGrade(); window.__silentGrade = false; }
}

/* ---------- timer (elapsed, count-up) ---------- */
var elapsed = 0, timerId = null, paused = false;
function fmt(s){ var m = Math.floor(s/60), ss = s%60; return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss; }
function drawTimer(){ document.getElementById("timer").textContent = fmt(elapsed); }
function startTimer(){
  if(timerId) return;
  timerId = setInterval(function(){
    if(paused || graded) return;
    elapsed++;
    drawTimer();
    if(elapsed % 5 === 0) saveState();
  },1000);
}
document.getElementById("btnPause").addEventListener("click", function(){
  paused = !paused;
  this.textContent = paused ? "再開する" : "一時停止";
  saveState();
  toast(paused ? "タイマーを一時停止しました" : "タイマーを再開しました");
});

/* ---------- selection ---------- */
function answeredCount(){
  var c = 0;
  for(var n=1;n<=TOTAL;n++) if(answers[n]) c++;
  return c;
}
function updateProg(){
  document.getElementById("prog").textContent = answeredCount() + " / " + TOTAL + " 解答済み";
  for(var n=1;n<=TOTAL;n++){
    var box = document.querySelector('[data-box="'+n+'"]');
    if(box) box.classList.toggle("filled", !!answers[n]);
  }
}
document.querySelectorAll(".choices").forEach(function(ul){
  var q = parseInt(ul.getAttribute("data-q"),10);
  ul.querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(graded) return;
      var v = parseInt(btn.getAttribute("data-v"),10);
      if(answers[q]===v){ delete answers[q]; btn.classList.remove("sel"); }
      else{
        answers[q]=v;
        ul.querySelectorAll("button").forEach(function(b){ b.classList.remove("sel"); });
        btn.classList.add("sel");
      }
      updateProg();
      saveState();
    });
  });
});
document.querySelectorAll(".flagbtn").forEach(function(b){
  b.addEventListener("click", function(){
    var n = parseInt(b.getAttribute("data-flag"),10);
    flags[n] = !flags[n];
    if(!flags[n]) delete flags[n];
    b.classList.toggle("on", !!flags[n]);
    b.textContent = flags[n] ? "見直し中" : "見直し";
    saveState();
  });
});

/* ---------- overlay / grid ---------- */
var overlay = document.getElementById("overlay"), panel = document.getElementById("panel");
function closeOverlay(){ overlay.classList.remove("open"); }
overlay.addEventListener("click", function(e){ if(e.target===overlay) closeOverlay(); });
function gridHTML(mode){
  var h = '<div class="grid32">';
  for(var n=1;n<=TOTAL;n++){
    var cls = "";
    if(mode==="result"){
      if(ANS[n]==null) cls = answers[n] ? "answered" : "empty";
      else cls = !answers[n] ? "empty" : (answers[n]===ANS[n] ? "ok" : "ng");
    }
    else { cls = answers[n] ? "answered" : "empty"; if(flags[n]) cls += " flagged"; }
    h += '<button class="'+cls+'" data-jumpq="'+n+'"><b>'+n+'</b>'+(answers[n]?MARKS[answers[n]]:"―")+(flags[n]?" ◆":"")+'</button>';
  }
  return h + "</div>";
}
function bindGrid(){
  panel.querySelectorAll("[data-jumpq]").forEach(function(b){
    b.addEventListener("click", function(){
      var n = b.getAttribute("data-jumpq");
      closeOverlay();
      var el = document.getElementById("q"+n);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
}
document.getElementById("btnSheet").addEventListener("click", function(){
  panel.innerHTML = "<h2>解答一覧</h2><p style='font-size:13px;color:#6d6a61'>番号をクリックするとその問題へ移動します。◆ は見直しフラグです。</p>"
    + gridHTML(graded ? "result" : "edit")
    + '<div class="row"><button class="btn" id="ovClose">閉じる</button></div>';
  overlay.classList.add("open");
  bindGrid();
  document.getElementById("ovClose").addEventListener("click", closeOverlay);
});

/* ---------- grading ---------- */
function doGrade(){
  graded = true;
  document.body.classList.add("done");
  paused = true; document.getElementById("btnPause").textContent = "一時停止";
  var total = 0, max = 0;
  for(var n=1;n<=TOTAL;n++){
    if(ANS[n]==null) continue;
    max += PTS[n];
    if(answers[n]===ANS[n]) total += PTS[n];
  }
  for(var n=1;n<=TOTAL;n++){
    var ul = document.querySelector('.choices[data-q="'+n+'"]');
    if(ul && ANS[n]!=null){
      ul.querySelectorAll("button").forEach(function(b){
        var v = parseInt(b.getAttribute("data-v"),10);
        if(v===ANS[n]) b.classList.add("correct");
        else if(answers[n]===v) b.classList.add("wrong");
      });
    }
    var ex = document.querySelector('[data-expl="'+n+'"]');
    if(!ex) continue;
    var verdict, cls;
    if(ANS[n]==null){ verdict = "正解が未設定です"; cls = "un"; }
    else if(!answers[n]){ verdict = "未解答（正解 " + MARKS[ANS[n]] + "）"; cls = "un"; }
    else if(answers[n]===ANS[n]){ verdict = "正解（+" + PTS[n] + "点）"; cls = "ok"; }
    else { verdict = "不正解（正解 " + MARKS[ANS[n]] + "）"; cls = "ng"; }
    var html = '<div class="verdict '+cls+'">'+verdict+'</div>';
    if(EXPL[n]) html += '<div><span class="goth" style="font-size:12px">解説</span>　'+EXPL[n]+'</div>';
    ex.innerHTML = html;
  }
  document.getElementById("btnGrade").disabled = true;
  saveState();
  if(window.__silentGrade) return;
  var rows = "";
  for(var n=1;n<=TOTAL;n++){
    var mark, pts;
    if(ANS[n]==null){ mark = "―"; pts = ""; }
    else if(!answers[n]){ mark = "未解答"; pts = "0 / " + PTS[n] + "点"; }
    else if(answers[n]===ANS[n]){ mark = "○"; pts = "+" + PTS[n] + "点"; }
    else { mark = "×"; pts = "0 / " + PTS[n] + "点"; }
    rows += '<div class="rowline" data-jumpq="'+n+'"><span>問'+n+'　'+mark+'</span><span>'+pts+'</span></div>';
  }
  panel.innerHTML = "<h2>採点結果</h2>"
    + '<div class="big">'+total+' <small>/ '+max+' 点</small></div>'
    + gridHTML("result")
    + '<div class="breakdown">'+rows+'</div>'
    + '<p style="font-size:13px;color:#6d6a61">各問題の下に正誤が表示されています。番号をタップすると問題へ移動します。</p>'
    + '<div class="row"><button class="btn solid" id="ovReview">問題を確認する</button><button class="btn" id="ovClose2">閉じる</button></div>';
  overlay.classList.add("open");
  bindGrid();
  document.getElementById("ovClose2").addEventListener("click", closeOverlay);
  document.getElementById("ovReview").addEventListener("click", function(){
    closeOverlay();
    var el = document.getElementById("q1");
    if(el) el.scrollIntoView({behavior:"smooth"});
  });
  toast("採点が完了しました：" + total + " 点");
}
document.getElementById("btnGrade").addEventListener("click", function(){
  if(graded) return;
  var un = [];
  for(var n=1;n<=TOTAL;n++) if(!answers[n]) un.push(n);
  if(un.length){
    panel.innerHTML = "<h2>未解答の問題があります</h2>"
      + '<p class="warnlist">次の ' + un.length + ' 問が未解答です：<br>' + un.join("、") + '</p>'
      + '<div class="row"><button class="btn" id="ovBack">解答に戻る</button><button class="btn solid" id="ovForce">このまま採点する</button></div>';
    overlay.classList.add("open");
    document.getElementById("ovBack").addEventListener("click", closeOverlay);
    document.getElementById("ovForce").addEventListener("click", function(){ closeOverlay(); doGrade(); });
  } else doGrade();
});

/* ---------- bar show / hide ---------- */
document.getElementById("btnHideBar").addEventListener("click", function(){ document.body.classList.add("bar-hidden"); });

/* ---------- export answers as text ---------- */
function buildExportText(){
  var lines = [];
  lines.push(TITLE);
  var head2 = "";
  if(graded){
    var total = 0, max = 0;
    for(var n=1;n<=TOTAL;n++){
      if(ANS[n]==null) continue;
      max += PTS[n];
      if(answers[n]===ANS[n]) total += PTS[n];
    }
    head2 = "得点 " + total + " / " + max + "点";
  } else {
    head2 = "未採点";
  }
  head2 += "　回答済み " + answeredCount() + " / " + TOTAL + "問　経過時間 " + fmt(elapsed);
  lines.push(head2);
  var wrong = [], unans = [];
  for(var n=1;n<=TOTAL;n++){
    var mine = answers[n] ? String(answers[n]) : "未回答";
    if(!answers[n]) unans.push(n);
    if(graded && ANS[n]!=null){
      var mark = !answers[n] ? "-" : (answers[n]===ANS[n] ? "○" : "×");
      if(answers[n] && answers[n]!==ANS[n]) wrong.push(n);
      lines.push("問" + n + ": 自分の解答 " + mine + " / 正解 " + ANS[n] + " / " + mark + " / " + PTS[n] + "点");
    } else {
      lines.push("問" + n + ": 自分の解答 " + mine);
    }
  }
  if(graded) lines.push("間違えた問題: " + (wrong.length ? wrong.join(", ") : "なし"));
  lines.push("未回答: " + (unans.length ? unans.join(", ") : "なし"));
  return lines.join("\n");
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("解答をコピーしました"); }, function(){ toast("コピーできませんでした"); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("解答をコピーしました"); }
    catch(e){ toast("コピーできませんでした"); }
    ta.remove();
  }
}
document.getElementById("btnExport").addEventListener("click", function(){
  var text = buildExportText();
  if(navigator.share){
    navigator.share({text: text}).catch(function(err){
      if(err && err.name !== "AbortError") copyText(text);
    });
  } else copyText(text);
});

/* ---------- nav / toast ---------- */
document.querySelectorAll("[data-jump]").forEach(function(b){
  b.addEventListener("click", function(){
    var el = document.getElementById(b.getAttribute("data-jump"));
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  });
});
var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
}
drawTimer(); updateProg(); loadState(); drawTimer(); updateProg(); startTimer();
</script>

<script src="convert.js"></script>
<script>
"use strict";
/* ================================================================
   共テ (Kyotei web) — 模試PDF → 解ける版HTML 変換アプリ
   変換ロジックは convert.js (KyoteiConvert) に集約。このスクリプトは
   UI とブラウザ固有のオーケストレーション（pdf.js 描画 / worker 管理）
   だけを持つ。
   ================================================================ */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

var KC = window.KyoteiConvert;
var RENDER_SCALE = 200 / 72; /* ≒200dpi */

/* ---------------- small helpers ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function yieldUI(){ return new Promise(function(r){ setTimeout(r, 0); }); }
var toastTimer = null;
function toast(msg){
  var t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function setProgress(stage, pageText){
  $("progressOverlay").hidden = false;
  $("progStage").textContent = stage;
  $("progPage").textContent = pageText || "";
}
function hideProgress(){ $("progressOverlay").hidden = true; }

/* ---------------- IndexedDB ---------------- */
function idbOpen(){
  return new Promise(function(res, rej){
    var req = indexedDB.open("kyotei-web", 1);
    req.onupgradeneeded = function(){
      req.result.createObjectStore("exams", { keyPath: "id" });
    };
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
}
async function idbAll(){
  var db = await idbOpen();
  try{
    return await new Promise(function(res, rej){
      var q = db.transaction("exams", "readonly").objectStore("exams").getAll();
      q.onsuccess = function(){ res(q.result || []); };
      q.onerror = function(){ rej(q.error); };
    });
  } finally { db.close(); }
}
async function idbPut(exam){
  var db = await idbOpen();
  try{
    await new Promise(function(res, rej){
      var q = db.transaction("exams", "readwrite").objectStore("exams").put(exam);
      q.onsuccess = function(){ res(); };
      q.onerror = function(){ rej(q.error); };
    });
  } finally { db.close(); }
}
async function idbDelete(id){
  var db = await idbOpen();
  try{
    await new Promise(function(res, rej){
      var q = db.transaction("exams", "readwrite").objectStore("exams").delete(id);
      q.onsuccess = function(){ res(); };
      q.onerror = function(){ rej(q.error); };
    });
  } finally { db.close(); }
}

/* ================================================================
   ページ描画 / OCR worker
   ================================================================ */
async function renderPageToCanvas(page){
  var viewport = page.getViewport({ scale: RENDER_SCALE });
  var canvas = document.createElement("canvas");
  canvas.width = Math.floor(viewport.width);
  canvas.height = Math.floor(viewport.height);
  var ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: viewport }).promise;
  return canvas;
}

var tessWorker = null;
async function ensureWorker(){
  if(!tessWorker) tessWorker = await Tesseract.createWorker("jpn");
  return tessWorker;
}
async function terminateWorker(){
  if(tessWorker){
    try{ await tessWorker.terminate(); }catch(e){}
    tessWorker = null;
  }
}

/* 解答PDF → OCRテキスト（テキスト層が乏しく幾何パースも効かない場合の保険） */
async function answerPDFOCRText(buf, worker, onPage){
  var doc = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
  var parts = [];
  try{
    for(var p = 1; p <= doc.numPages; p++){
      if(onPage) onPage(p, doc.numPages);
      var page = await doc.getPage(p);
      var canvas = await renderPageToCanvas(page);
      var ocr = await KC.ocrImage(worker, canvas, canvas.width, canvas.height);
      parts.push(ocr.lines.map(function(l){ return l.text; }).join(" "));
      canvas.width = 0; canvas.height = 0;
      await yieldUI();
    }
  } finally { doc.destroy(); }
  return parts.join(" ");
}

/* 解答PDF → {key, points, count, method}（幾何パース優先） */
async function parseAnswerBuf(buf){
  var pages = await KC.extractPdfPages(pdfjsLib, buf.slice(0));
  var joined = KC.answerJoinedText(pages);
  if(joined.replace(/\s/g, "").length >= 100){
    return KC.parseAnswerKeyFromPages(pages);
  }
  var worker = await ensureWorker();
  var ocrText = await answerPDFOCRText(buf, worker, function(p, total){
    setProgress("解答PDFを読み取り中…", "ページ " + p + " / " + total);
  });
  var scanned = KC.scanAnswerTokens(KC.tokenize(ocrText));
  return {
    key: scanned.key, points: scanned.points,
    count: Object.keys(scanned.key).length, method: "ocr-scan"
  };
}

/* ================================================================
   変換オーケストレーション
   ================================================================ */
async function convertExam(opts){
  var title = opts.title, storageKey = opts.storageKey;
  var answerKey = {}, points = {};
  try{
    /* ---- 解答キー ---- */
    if(opts.keyOverride){
      answerKey = opts.keyOverride.key || {};
      points = opts.keyOverride.points || {};
    } else if(opts.aBuf){
      setProgress("解答PDFを解析中…", "");
      var parsed = await parseAnswerBuf(opts.aBuf);
      answerKey = parsed.key; points = parsed.points;
    }

    /* ---- 問題PDF ---- */
    var doc = await pdfjsLib.getDocument({ data: opts.qBuf.slice(0) }).promise;
    var pageCount = doc.numPages;
    var figureCount = 0, lineCount = 0;
    var allEvents = [];
    try{
      /* テキスト層チェック（文書全体で1回） */
      setProgress("テキストを確認中…", "");
      var pageTC = [];
      var totalChars = 0, jpChars = 0;
      for(var p0 = 1; p0 <= pageCount; p0++){
        var pg0 = await doc.getPage(p0);
        var vp0 = pg0.getViewport({ scale: 1 });
        var tc0 = await pg0.getTextContent();
        var plain = tc0.items.map(function(it){ return it.str; }).join("");
        var stripped = plain.replace(/\s/g, "");
        totalChars += stripped.length;
        jpChars += KC.countJapanese(stripped);
        pageTC.push({ tc: tc0, w: vp0.width, h: vp0.height });
      }
      var useTextLayer = totalChars >= 800 && totalChars > 0 && (jpChars / totalChars) >= 0.5;

      for(var p = 1; p <= pageCount; p++){
        var pageLabel = "ページ " + p + " / " + pageCount;
        if(useTextLayer){
          setProgress("組み立て中…", pageLabel);
          var conv = KC.linesFromTextContent(pageTC[p-1].tc, pageTC[p-1].w, pageTC[p-1].h);
          lineCount += conv.lines.length;
          var orderedTL = KC.readingOrder(conv.lines);
          orderedTL.forEach(function(line){
            line.page = p - 1;
            if(!KC.isNoiseLine(line)) allEvents.push({ kind: "line", y: line.y, line: line });
          });
        } else {
          setProgress("ページを描画中…", pageLabel);
          var page = await doc.getPage(p);
          var canvas = await renderPageToCanvas(page);
          setProgress("文字を読み取り中…", pageLabel);
          var worker = await ensureWorker();
          var ocr = await KC.ocrImage(worker, canvas, canvas.width, canvas.height);
          lineCount += ocr.lines.length;
          var ordered = KC.readingOrder(ocr.lines);
          var lineEvents = [];
          ordered.forEach(function(line){
            line.page = p - 1;
            if(!KC.isNoiseLine(line)) lineEvents.push({ kind: "line", y: line.y, line: line });
          });
          setProgress("図を検出中…", pageLabel);
          await yieldUI();
          var ctx2 = canvas.getContext("2d", { willReadFrequently: true });
          var imgData = ctx2.getImageData(0, 0, canvas.width, canvas.height);
          var gray = KC.grayFromRGBA(imgData.data, canvas.width, canvas.height);
          var bands = KC.detectFigureBands(gray, canvas.width, canvas.height, ocr.words);
          var figEvents = [];
          bands.forEach(function(band){
            var url = KC.cropBandToDataURL(canvas, band);
            if(url){
              figureCount++;
              figEvents.push({ kind: "figure", y: band.yMin, page: p - 1, src: url });
            }
          });
          KC.mergePageEvents(lineEvents, figEvents).forEach(function(ev){ allEvents.push(ev); });
          canvas.width = 0; canvas.height = 0;
        }
        await yieldUI();
      }
    } finally { doc.destroy(); }

    setProgress("組み立て中…", "");
    var built = KC.buildElements(allEvents, Object.keys(answerKey).length);
    var templates = { css: $("gen-css").textContent, js: $("gen-js").textContent };
    var html = KC.buildHTML(title, built.elements, answerKey, points, storageKey, templates);
    return {
      generatedHTML: html, answerKey: answerKey, points: points,
      questionCount: built.questions, pageCount: pageCount,
      lineCount: lineCount, figureCount: figureCount
    };
  } finally {
    await terminateWorker();
  }
}

/* ================================================================
   UI
   ================================================================ */
var editingExamId = null;

function showView(name){
  ["view-library", "view-import", "view-keyedit"].forEach(function(id){
    $(id).hidden = id !== ("view-" + name);
  });
}
function newId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "ex" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function fmtDate(ts){
  var d = new Date(ts);
  return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " +
    ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

async function renderLibrary(){
  var exams = await idbAll();
  exams.sort(function(a, b){ return b.createdAt - a.createdAt; });
  var list = $("examList");
  list.innerHTML = "";
  $("emptyMsg").hidden = exams.length > 0;
  exams.forEach(function(exam){
    var card = document.createElement("div");
    card.className = "exam-card";
    var keyCount = Object.keys(exam.answerKey || {}).length;
    card.innerHTML =
      '<p class="etitle">' + esc(exam.title) + "</p>"
      + '<p class="emeta">' + fmtDate(exam.createdAt) + "　全" + exam.questionCount + "問"
      + (keyCount ? "　正解 " + keyCount + "問分" : "　正解 未設定") + "</p>"
      + '<p class="ediag">' + exam.pageCount + "ページ／行 " + exam.lineCount + "／図 " + exam.figureCount + "</p>"
      + '<div class="erow">'
      + '<button class="btn solid small" data-action="solve">解く</button>'
      + '<button class="btn small" data-action="key">正解を編集</button>'
      + '<button class="btn small" data-action="regen">再生成</button>'
      + '<button class="btn danger small" data-action="del">削除</button>'
      + "</div>";
    card.querySelectorAll("button").forEach(function(btn){
      btn.addEventListener("click", function(){
        onExamAction(btn.getAttribute("data-action"), exam);
      });
    });
    list.appendChild(card);
  });
}

async function onExamAction(action, exam){
  if(action === "solve"){
    $("solveTitle").textContent = exam.title;
    $("appbar").hidden = true;
    $("mainArea").hidden = true;
    $("view-solve").hidden = false;
    $("solveFrame").srcdoc = exam.generatedHTML;
  } else if(action === "key"){
    openKeyEdit(exam);
  } else if(action === "del"){
    if(!confirm("「" + exam.title + "」を削除しますか？")) return;
    await idbDelete(exam.id);
    try{ localStorage.removeItem("kyotei-progress-" + exam.id); }catch(e){}
    await renderLibrary();
    toast("削除しました");
  } else if(action === "regen"){
    try{
      setProgress("再生成中…", "");
      var r = await convertExam({
        title: exam.title, qBuf: exam.questionPDF, aBuf: exam.answerPDF || null,
        keyOverride: null, storageKey: "kyotei-progress-" + exam.id
      });
      Object.assign(exam, r);
      await idbPut(exam);
      hideProgress();
      await renderLibrary();
      toast("再生成しました（全" + r.questionCount + "問）");
    }catch(err){
      hideProgress();
      toast("再生成に失敗しました");
    }
  }
}

$("solveBack").addEventListener("click", function(){
  $("solveFrame").srcdoc = "";
  $("view-solve").hidden = true;
  $("appbar").hidden = false;
  $("mainArea").hidden = false;
  showView("library");
});

/* ---- 正解・配点の編集 ---- */
function openKeyEdit(exam){
  editingExamId = exam.id;
  $("keyEditTitle").textContent = exam.title + "（全" + exam.questionCount + "問）";
  var rows = $("keyRows");
  rows.innerHTML = "";
  for(var n = 1; n <= exam.questionCount; n++){
    var row = document.createElement("div");
    row.className = "keyrow";
    var sel = '<select data-kno="' + n + '"><option value="">未設定</option>';
    for(var v = 1; v <= 9; v++){
      sel += '<option value="' + v + '"' + (exam.answerKey && exam.answerKey[n] === v ? " selected" : "") + ">" + v + "</option>";
    }
    sel += "</select>";
    var pts = exam.points && exam.points[n] != null ? exam.points[n] : 1;
    row.innerHTML = '<span class="kno">問' + n + "</span><label>正解</label>" + sel
      + '<label>配点</label><input type="number" data-pno="' + n + '" min="0" max="100" value="' + pts + '">';
    rows.appendChild(row);
  }
  showView("keyedit");
}
$("keyCancel").addEventListener("click", function(){ showView("library"); });
$("keySave").addEventListener("click", async function(){
  var exams = await idbAll();
  var exam = exams.filter(function(e){ return e.id === editingExamId; })[0];
  if(!exam){ showView("library"); return; }
  var key = {}, points = {};
  $("keyRows").querySelectorAll("select[data-kno]").forEach(function(sel){
    var n = parseInt(sel.getAttribute("data-kno"), 10);
    if(sel.value) key[n] = parseInt(sel.value, 10);
  });
  $("keyRows").querySelectorAll("input[data-pno]").forEach(function(inp){
    var n = parseInt(inp.getAttribute("data-pno"), 10);
    var v = parseInt(inp.value, 10);
    points[n] = isNaN(v) || v < 0 ? 1 : v;
  });
  exam.answerKey = key;
  exam.points = points;
  try{
    setProgress("再生成中…", "");
    var r = await convertExam({
      title: exam.title, qBuf: exam.questionPDF, aBuf: exam.answerPDF || null,
      keyOverride: { key: key, points: points },
      storageKey: "kyotei-progress-" + exam.id
    });
    Object.assign(exam, r);
    exam.answerKey = key; exam.points = points;
    await idbPut(exam);
    hideProgress();
    await renderLibrary();
    showView("library");
    toast("正解・配点を保存しました");
  }catch(err){
    hideProgress();
    toast("再生成に失敗しました");
  }
});

/* ---- 取り込み ---- */
var impQFile = null, impAFile = null;
function resetImport(){
  impQFile = null; impAFile = null;
  $("impTitle").value = "";
  $("impQName").textContent = "";
  $("impAName").textContent = "";
  $("impQ").value = ""; $("impA").value = "";
  $("impAClear").hidden = true;
  $("impError").textContent = "";
}
$("btnNew").addEventListener("click", function(){ resetImport(); showView("import"); });
$("impCancel").addEventListener("click", function(){ showView("library"); });
$("impQ").addEventListener("change", function(){
  impQFile = this.files && this.files[0] ? this.files[0] : null;
  $("impQName").textContent = impQFile ? impQFile.name : "";
  if(impQFile && !$("impTitle").value){
    $("impTitle").value = impQFile.name.replace(/\.pdf$/i, "");
  }
});
$("impA").addEventListener("change", function(){
  impAFile = this.files && this.files[0] ? this.files[0] : null;
  $("impAName").textContent = impAFile ? impAFile.name : "";
  $("impAClear").hidden = !impAFile;
});
$("impAClear").addEventListener("click", function(){
  impAFile = null;
  $("impA").value = "";
  $("impAName").textContent = "";
  $("impAClear").hidden = true;
});
$("impStart").addEventListener("click", async function(){
  $("impError").textContent = "";
  if(!impQFile){
    $("impError").textContent = "問題PDFを選んでください。";
    return;
  }
  var title = $("impTitle").value.replace(/^\s+|\s+$/g, "") || impQFile.name.replace(/\.pdf$/i, "");
  try{
    setProgress("PDFを読み込んでいます…", "");
    var qBuf = await impQFile.arrayBuffer();
    var aBuf = impAFile ? await impAFile.arrayBuffer() : null;
    var id = newId();
    var r = await convertExam({
      title: title, qBuf: qBuf, aBuf: aBuf,
      keyOverride: null, storageKey: "kyotei-progress-" + id
    });
    var exam = {
      id: id, title: title, createdAt: Date.now(),
      questionCount: r.questionCount, generatedHTML: r.generatedHTML,
      answerKey: r.answerKey, points: r.points,
      pageCount: r.pageCount, lineCount: r.lineCount, figureCount: r.figureCount,
      questionPDF: qBuf, answerPDF: aBuf
    };
    await idbPut(exam);
    hideProgress();
    await renderLibrary();
    showView("library");
    if(r.questionCount === 0){
      toast("取り込みましたが、問題を検出できませんでした");
    } else {
      toast("取り込みました（全" + r.questionCount + "問）");
    }
  }catch(err){
    hideProgress();
    $("impError").textContent = "変換に失敗しました：" + (err && err.message ? err.message : err);
  }
});

/* ---- 初期化 / Service Worker ---- */
renderLibrary();
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
