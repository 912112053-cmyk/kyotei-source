<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2b28">
<meta name="color-scheme" content="light dark">
<title>共テ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="AppIcon1024.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bar:#2b2b28; --bar-tx:#f2f0e9;
    --accent:#8c2f2f; --accent-soft:#f3e6e3;
    --bg:#efe9dc; --card:#fffdf8; --ink:#26241f; --mut:#6d6a61; --line:#d8d2c2;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1b18; --card:#26261f; --ink:#ece8db; --mut:#a49f8f; --line:#3d3a30; --accent-soft:#3a2624; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;}
  #appbar{background:var(--bar);color:var(--bar-tx);display:flex;align-items:center;gap:10px;
    padding:10px 16px;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #appbar img{width:30px;height:30px;border-radius:7px}
  #appbar[hidden]{display:none}
  #appbar .apptitle{font-size:19px;font-weight:600;letter-spacing:.12em}
  #appbar .appsub{font-size:11.5px;opacity:.72}
  main{max-width:860px;margin:0 auto;padding:20px 14px 80px}
  main[hidden]{display:none}
  h2{font-size:18px;margin:4px 0 14px;letter-spacing:.04em}
  .muted{color:var(--mut);font-size:12.5px;line-height:1.7}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-family:inherit;font-size:13.5px;font-weight:500;padding:8px 16px;border-radius:6px;cursor:pointer}
  .btn:hover{filter:brightness(1.05)}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:#a12626;border-color:#c9a3a3}
  .btn.small{padding:5px 11px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:var(--bar-tx)}
  .exam-card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .exam-card .etitle{font-size:16.5px;font-weight:600;margin:0 0 4px;word-break:break-all}
  .exam-card .emeta{font-size:12.5px;color:var(--mut);margin:0 0 12px}
  .exam-card .erow{display:flex;gap:8px;flex-wrap:wrap}
  .fld{display:block;margin:0 0 18px}
  .fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .fld input[type=text],.fld input[type=url]{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);
    border-radius:6px;background:var(--card);color:var(--ink)}
  .filebtn{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--mut);border-radius:6px;
    padding:10px 14px;cursor:pointer;font-size:13.5px;background:var(--card);max-width:100%}
  .filebtn .fname{color:var(--mut);font-size:12.5px;word-break:break-all}
  .visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
  #progressOverlay{position:fixed;inset:0;z-index:60;background:rgba(15,14,12,.55);
    display:flex;align-items:center;justify-content:center;padding:20px}
  #progressOverlay[hidden]{display:none}
  .pcard{background:var(--card);color:var(--ink);border-radius:12px;padding:28px 30px;text-align:center;
    min-width:240px;box-shadow:0 16px 44px rgba(0,0,0,.4)}
  .spinner{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
    border:4px solid var(--line);border-top-color:var(--accent);animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #progStage{font-size:15px;font-weight:600}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#2b2b28;color:#f2f0e9;font-size:13.5px;padding:10px 20px;border-radius:6px;opacity:0;
    pointer-events:none;transition:.3s;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .err{color:#a12626;font-size:13px;line-height:1.7;white-space:pre-wrap}

  /* ================= 解く画面（元のページ画像） ================= */
  #view-solve{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#55534c}
  #view-solve[hidden]{display:none}
  .solvebar{background:var(--bar);color:var(--bar-tx);display:flex;align-items:center;gap:8px;
    padding:8px 12px;flex:none;flex-wrap:wrap}
  .solvebar[hidden]{display:none}
  .solvebar .stitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1;min-width:60px}
  .solvebar .stimer{font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:600;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
    padding:3px 10px;border-radius:3px;letter-spacing:.05em}
  #solveMenuPill{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:45;
    background:var(--bar);color:var(--bar-tx);border:1px solid rgba(255,255,255,.35);
    border-radius:999px;padding:7px 16px;font-size:12.5px;font-family:inherit;
    box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}
  #solveMenuPill[hidden]{display:none}
  #pagesScroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  #pagesInner{margin:0 auto;padding:14px 10px 40px}
  #pagesInner .pagewrap{position:relative;margin:0 auto 14px;background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.45);line-height:0}
  #pagesInner .pagewrap img{display:block;width:100%;height:auto}
  #pagesInner .pagewrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;
    pointer-events:none}
  #pagesInner.ink-on .pagewrap canvas{pointer-events:auto;touch-action:none}
  .solvebar .btn.tool-on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ================= マークシート ================= */
  #sheetOverlay{position:fixed;inset:0;z-index:50;background:rgba(15,14,12,.62);
    overflow:auto;padding:18px 10px 30px}
  #sheetOverlay[hidden]{display:none}
  .sheet{background:#fff;color:#161513;max-width:700px;margin:0 auto;
    border:1.6px solid #161513;padding:20px 16px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    border-bottom:2.2px solid #161513;padding-bottom:8px;margin-bottom:6px}
  .sheet-head .shtitle{font-size:15px;font-weight:600;word-break:break-all}
  .sheet-head .shlabel{font-size:13px;font-weight:600;letter-spacing:.35em;flex:none}
  #scoreBanner{display:none;border:1.6px solid #161513;margin:10px 0 4px;padding:8px 12px;
    text-align:center;font-size:15px}
  #scoreBanner.show{display:block}
  #scoreBanner .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  #scoreBanner small{font-size:13px;color:#55524b}
  .msblocks{display:flex;flex-wrap:wrap;gap:18px 22px;margin-top:8px}
  .msblock{flex:1 1 300px;min-width:280px}
  .msgrid{display:grid;grid-template-columns:40px repeat(9,1fr) 26px;align-items:center}
  .msgrid.head{border-bottom:1.6px solid #161513;padding:3px 0 5px}
  .msgrid.head .hc{text-align:center;font-size:12.5px;font-weight:600;color:#161513}
  .msgrid.head .hc.num{text-align:center;font-size:11.5px;letter-spacing:.05em}
  .msrow{border-bottom:.8px solid #a9a69c;padding:4px 0}
  .msrow .rno{text-align:center;font-weight:700;font-size:14.5px;border-right:1.2px solid #161513;
    align-self:stretch;display:flex;align-items:center;justify-content:center}
  .msrow .res{text-align:center;font-size:15px;font-weight:700}
  .msrow .res.ok{color:#1d6b45}
  .msrow .res.ng{color:#a12626}
  .msrow .res.blank{color:#8a867c}
  .bubble{appearance:none;background:transparent;border:none;padding:2px 0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:inherit}
  .bubble .ov{display:flex;align-items:center;justify-content:center;
    width:min(32px,100%);height:23px;border:1.6px solid #55534c;border-radius:50%;
    font-size:12px;color:#a3a099;line-height:1}
  .bubble.filled .ov{background:#2e2c29;border-color:#2e2c29;color:#2e2c29}
  .bubble.correct-hint .ov{border-color:#c02727;box-shadow:0 0 0 1.6px #c02727;color:#c02727;font-weight:700}
  .sheet-sticky{position:sticky;top:0;z-index:5;background:#fff;margin-bottom:8px}
  .sheet-bar{display:flex;align-items:center;
    justify-content:space-between;gap:10px;
    border-bottom:1.6px solid #161513;padding:8px 0}
  .sheet-bar .unmarked{font-size:13.5px}
  .sheet-bar .srow{display:flex;gap:8px;flex:none}
  .sheet-bar .btn{border-color:#8a867c;color:#161513;background:#fff}
  .sheet-bar .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
  .secnav{display:flex;gap:6px;flex-wrap:wrap;padding-top:8px}
  .secnav[hidden]{display:none}
  .secnav button{font:inherit;font-size:13.5px;padding:6px 11px;border:1.6px solid #161513;
    background:#fff;color:#161513;border-radius:999px;cursor:pointer}
  .secnav button.on{background:#161513;color:#fff}
  .secnav .secprog{font-size:11.5px;opacity:.7;margin-left:4px}
</style>
</head>
<body>

<header id="appbar">
  <img src="icon-192.png" alt="">
  <span class="apptitle">共テ</span>
</header>

<main id="mainArea">
  <!-- ライブラリ -->
  <section id="view-library" class="view">
    <div class="row-between">
      <h2>ライブラリ</h2>
      <button class="btn solid" id="btnNew">模試を取り込む</button>
    </div>
    <div id="examList"></div>
    <p id="emptyMsg" class="muted">まだ模試がありません。「模試を取り込む」から問題PDFを追加してください。</p>
    <p class="muted" style="font-size:11px;margin-top:24px">アプリ v19（マークシート）</p>
  </section>

  <!-- 取り込み -->
  <section id="view-import" class="view" hidden>
    <h2>模試を取り込む</h2>
    <label class="fld"><span>タイトル</span>
      <input type="text" id="impTitle" placeholder="模試の名前">
    </label>
    <div class="fld"><span>問題PDF（必須）</span>
      <label class="filebtn"><input type="file" id="impQ" accept="application/pdf" class="visually-hidden"><span>PDFを選ぶ</span><span class="fname" id="impQName"></span></label>
      <input type="url" id="impQUrl" placeholder="または PDFのURLを貼る" autocomplete="off">
    </div>
    <div class="fld"><span>解答PDF（任意）</span>
      <label class="filebtn"><input type="file" id="impA" accept="application/pdf" class="visually-hidden"><span>PDFを選ぶ</span><span class="fname" id="impAName"></span></label>
      <input type="url" id="impAUrl" placeholder="または PDFのURLを貼る" autocomplete="off">
      <button class="btn small" id="impAClear" hidden>解答PDFを外す</button>
      <p class="muted">解答PDFがあると、マークシートで採点できます。ない場合は、採点なしで解く形になります。URLは、サイト側が外部からの取得を許可していないと使えません（その場合はファイルをダウンロードして選んでください）。</p>
    </div>
    <p class="err" id="impError"></p>
    <div class="row">
      <button class="btn" id="impCancel">キャンセル</button>
      <button class="btn solid" id="impStart">取り込む</button>
    </div>
    <p class="muted">変換はすべてこの端末の中（ブラウザ内）で行われます。PDFが外部サーバーに送信されることはありません。初回は描画エンジンの取得で通信が発生します。</p>
  </section>
</main>

<!-- 解く画面：元のページ画像 + マークシート -->
<section id="view-solve" hidden>
  <div class="solvebar" id="solveBar">
    <button class="btn ghost small" id="solveBack">← 戻る</button>
    <span class="stitle" id="solveTitle"></span>
    <span class="stimer" id="solveTimer">00:00</span>
    <button class="btn ghost small" id="btnTimerToggle">一時停止</button>
    <button class="btn ghost small" id="btnTimerReset">時間リセット</button>
    <button class="btn ghost small" id="btnZoomOut">－</button><span class="stimer" id="zoomPct">100%</span><button class="btn ghost small" id="btnZoomIn">＋</button>
    <button class="btn ghost small" id="btnPen">ペン</button>
    <button class="btn ghost small" id="btnEraser">消しゴム</button>
    <button class="btn ghost small" id="btnInkClear" hidden>全消し</button>
    <button class="btn ghost small" id="btnSheet">マークシート</button>
    <button class="btn ghost small" id="btnHideBar">隠す</button>
  </div>
  <button id="solveMenuPill" hidden>メニュー</button>
  <div id="pagesScroll"><div id="pagesInner"></div></div>

  <!-- マークシート（本物の共テ解答用紙形式：全行9択の楕円） -->
  <div id="sheetOverlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <span class="shtitle" id="sheetTitle"></span>
        <span class="shlabel">解答用紙</span>
      </div>
      <div class="sheet-sticky">
        <div class="sheet-bar">
          <span class="unmarked" id="unmarkedLine"></span>
          <span class="srow">
            <button class="btn small" id="sheetClose">閉じる</button>
            <button class="btn small solid" id="sheetGrade">採点する</button>
            <button class="btn small" id="sheetExport" hidden>解答を出力</button>
          </span>
        </div>
        <div class="secnav" id="secNav" hidden></div>
      </div>
      <div id="scoreBanner"></div>
      <div class="msblocks" id="msBlocks"></div>
    </div>
  </div>
</section>

<!-- 変換プログレス -->
<div id="progressOverlay" hidden>
  <div class="pcard">
    <div class="spinner"></div>
    <div id="progStage">変換中…</div>
    <div id="progPage" class="muted"></div>
  </div>
</div>

<div id="toast"></div>

<script src="convert.js"></script>
<script>
"use strict";
/* ================================================================
   共テ (Kyotei web) v13 — マークシート方式
   問題PDFは「元のページ画像」として表示し、解答は本物の共テ解答用紙と
   同じ「全行9択の楕円マークシート」で行う。OCR・文字の組み直しはしない。
   convert.js は解答PDFの正解・配点パース専用。
   ================================================================ */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

var KC = window.KyoteiConvert;
var RENDER_SCALE = 200 / 72; /* ≒200dpi */
var JPEG_QUALITY = 0.85;
var DEFAULT_ROWS = 40; /* 解答PDFがなく正解数が分からない場合のマーク行数 */

/* ---------------- small helpers ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function yieldUI(){ return new Promise(function(r){ setTimeout(r, 0); }); }
var toastTimer = null;
function toast(msg){
  var t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function setProgress(stage, pageText){
  $("progressOverlay").hidden = false;
  $("progStage").textContent = stage;
  $("progPage").textContent = pageText || "";
}
function hideProgress(){ $("progressOverlay").hidden = true; }
function fmtTime(s){
  var m = Math.floor(s / 60), ss = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
}

/* ---------------- IndexedDB ---------------- */
function idbOpen(){
  return new Promise(function(res, rej){
    var req = indexedDB.open("kyotei-web", 1);
    req.onupgradeneeded = function(){
      req.result.createObjectStore("exams", { keyPath: "id" });
    };
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
}
async function idbAll(){
  var db = await idbOpen();
  try{
    return await new Promise(function(res, rej){
      var q = db.transaction("exams", "readonly").objectStore("exams").getAll();
      q.onsuccess = function(){ res(q.result || []); };
      q.onerror = function(){ rej(q.error); };
    });
  } finally { db.close(); }
}
async function idbPut(exam){
  var db = await idbOpen();
  try{
    await new Promise(function(res, rej){
      var q = db.transaction("exams", "readwrite").objectStore("exams").put(exam);
      q.onsuccess = function(){ res(); };
      q.onerror = function(){ rej(q.error); };
    });
  } finally { db.close(); }
}
async function idbDelete(id){
  var db = await idbOpen();
  try{
    await new Promise(function(res, rej){
      var q = db.transaction("exams", "readwrite").objectStore("exams").delete(id);
      q.onsuccess = function(){ res(); };
      q.onerror = function(){ rej(q.error); };
    });
  } finally { db.close(); }
}

/* ================================================================
   ページ描画（MuPDF 優先、ページ単位で pdf.js フォールバック）
   pdf.js は埋め込みサブセットフォント (Type1C, ToUnicode なし) の
   一部ページで本文を描画できないため、主描画は MuPDF.js を使う。
   ================================================================ */
async function renderPageToCanvas(page){
  var viewport = page.getViewport({ scale: RENDER_SCALE });
  var canvas = document.createElement("canvas");
  canvas.width = Math.floor(viewport.width);
  canvas.height = Math.floor(viewport.height);
  var ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: viewport }).promise;
  return canvas;
}

var MUPDF_MODULE_URL = "https://cdn.jsdelivr.net/npm/mupdf@1.28.6/dist/mupdf.js";
var mupdfMod = null;
var mupdfModulePromise = null;
function loadMuPDF(){
  if(mupdfMod) return Promise.resolve(mupdfMod);
  if(!mupdfModulePromise){
    mupdfModulePromise = import(MUPDF_MODULE_URL).then(function(mod){
      mupdfMod = mod;
      return mod;
    });
    mupdfModulePromise.catch(function(){ mupdfModulePromise = null; });
  }
  return mupdfModulePromise;
}
async function openMuPDFDoc(buf){
  var mupdf = await loadMuPDF();
  return mupdf.Document.openDocument(new Uint8Array(buf.slice(0)), "application/pdf");
}
function renderMuPDFPageToCanvas(muDoc, pageIndex){
  var page = muDoc.loadPage(pageIndex);
  try{
    var pixmap = page.toPixmap(
      mupdfMod.Matrix.scale(RENDER_SCALE, RENDER_SCALE),
      mupdfMod.ColorSpace.DeviceRGB, false);
    try{
      var w = pixmap.getWidth(), h = pixmap.getHeight();
      var n = pixmap.getNumberOfComponents();
      var hasAlpha = pixmap.getAlpha();
      var stride = pixmap.getStride();
      var px = pixmap.getPixels();
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d", { willReadFrequently: true });
      var img = ctx.createImageData(w, h);
      var out = img.data;
      for(var y = 0; y < h; y++){
        var srow = y * stride, drow = y * w * 4;
        for(var x = 0; x < w; x++){
          var s = srow + x * n, d = drow + x * 4;
          out[d] = px[s]; out[d + 1] = px[s + 1]; out[d + 2] = px[s + 2];
          out[d + 3] = hasAlpha ? px[s + 3] : 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      return canvas;
    } finally { pixmap.destroy(); }
  } finally { page.destroy(); }
}

function canvasToBlob(canvas){
  return new Promise(function(res, rej){
    if(canvas.toBlob){
      canvas.toBlob(function(b){ b ? res(b) : rej(new Error("画像の生成に失敗しました")); },
        "image/jpeg", JPEG_QUALITY);
    } else {
      /* toBlob がない環境向けフォールバック */
      var url = canvas.toDataURL("image/jpeg", JPEG_QUALITY);
      var bin = atob(url.split(",")[1]);
      var arr = new Uint8Array(bin.length);
      for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      res(new Blob([arr], { type: "image/jpeg" }));
    }
  });
}

/* 問題PDFの全ページを JPEG Blob 化する */
async function renderAllPages(qBuf, onPage){
  var muDoc = null;
  try { muDoc = await openMuPDFDoc(qBuf); } catch(e){ muDoc = null; }
  var pdfDoc = null;
  var engine = muDoc ? "MuPDF" : "pdf.js";
  try{
    var n;
    if(muDoc) n = muDoc.countPages();
    else {
      pdfDoc = await pdfjsLib.getDocument({ data: qBuf.slice(0) }).promise;
      n = pdfDoc.numPages;
    }
    var blobs = [];
    for(var p = 0; p < n; p++){
      if(onPage) onPage(p + 1, n);
      var canvas = null;
      if(muDoc){
        try { canvas = renderMuPDFPageToCanvas(muDoc, p); }
        catch(e){ canvas = null; }
      }
      if(!canvas){
        if(!pdfDoc) pdfDoc = await pdfjsLib.getDocument({ data: qBuf.slice(0) }).promise;
        var page = await pdfDoc.getPage(p + 1);
        canvas = await renderPageToCanvas(page);
        if(muDoc) engine = "MuPDF/pdf.js";
      }
      blobs.push(await canvasToBlob(canvas));
      canvas.width = 0; canvas.height = 0;
      await yieldUI();
    }
    return { blobs: blobs, pageCount: n, renderEngine: engine };
  } finally {
    if(muDoc){ try { muDoc.destroy(); } catch(e){} }
    if(pdfDoc){ try { pdfDoc.destroy(); } catch(e){} }
  }
}

/* 解答PDF → {key, points, count, method}（幾何パース。OCRは使わない） */
async function parseAnswerBuf(buf){
  var pages = await KC.extractPdfPages(pdfjsLib, buf.slice(0));
  return KC.parseAnswerKeyFromPages(pages);
}

/* ================================================================
   変換： 解答キー抽出 + 全ページ画像化（数秒で終わる）
   ================================================================ */
async function convertExam(opts){
  var answerKey = {}, points = {}, parsedSections = null;
  if(opts.aBuf){
    setProgress("解答PDFを解析中…", "");
    var parsed = await parseAnswerBuf(opts.aBuf);
    answerKey = parsed.key; points = parsed.points;
    parsedSections = parsed.sections || null;
  }
  var r = await renderAllPages(opts.qBuf, function(p, total){
    setProgress("ページを描画中…", "ページ " + p + " / " + total);
  });
  var keyCount = Object.keys(answerKey).length;
  return {
    pageImages: r.blobs, pageCount: r.pageCount, renderEngine: r.renderEngine,
    answerKey: answerKey, points: points, sections: parsedSections,
    questionCount: keyCount > 0 ? keyCount : DEFAULT_ROWS
  };
}

/* 旧レコード（v10以前: generatedHTML のみ）用にページ画像だけを作り直す */
async function ensurePageImages(exam){
  if(exam.pageImages && exam.pageImages.length) return true;
  if(!exam.questionPDF){
    toast("元の問題PDFがないため表示できません");
    return false;
  }
  try{
    setProgress("ページを描画中…", "");
    var r = await renderAllPages(exam.questionPDF, function(p, total){
      setProgress("ページを描画中…", "ページ " + p + " / " + total);
    });
    exam.pageImages = r.blobs;
    exam.pageCount = r.pageCount;
    exam.renderEngine = r.renderEngine;
    delete exam.generatedHTML; /* 旧方式の生成HTMLはもう使わない */
    await idbPut(exam);
    hideProgress();
    return true;
  }catch(err){
    hideProgress();
    toast("ページの描画に失敗しました");
    return false;
  }
}

/* ================================================================
   ライブラリ
   ================================================================ */
function showView(name){
  ["view-library", "view-import"].forEach(function(id){
    $(id).hidden = id !== ("view-" + name);
  });
}
function newId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "ex" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function fmtDate(ts){
  var d = new Date(ts);
  return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " +
    ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

async function renderLibrary(){
  var exams = await idbAll();
  exams.sort(function(a, b){ return b.createdAt - a.createdAt; });
  var list = $("examList");
  list.innerHTML = "";
  $("emptyMsg").hidden = exams.length > 0;
  exams.forEach(function(exam){
    var card = document.createElement("div");
    card.className = "exam-card";
    var keyCount = Object.keys(exam.answerKey || {}).length;
    card.innerHTML =
      '<p class="etitle">' + esc(exam.title) + "</p>"
      + '<p class="emeta">' + fmtDate(exam.createdAt) + "　全" + exam.questionCount + "問"
      + (keyCount ? "　正解 " + keyCount + "問分" : "　正解 未設定")
      + "　" + exam.pageCount + "ページ</p>"
      + '<div class="erow">'
      + '<button class="btn solid small" data-action="solve">解く</button>'

      + '<button class="btn danger small" data-action="del">削除</button>'
      + "</div>";
    card.querySelectorAll("button").forEach(function(btn){
      btn.addEventListener("click", function(){
        onExamAction(btn.getAttribute("data-action"), exam, btn);
      });
    });
    list.appendChild(card);
  });
}

/* 旧レコード（大問情報なし）: 保存済みの解答PDFから大問の範囲だけを取り直す */
async function ensureSections(exam){
  if(exam.sections !== undefined || !exam.answerPDF) return;
  try{
    var parsed = await parseAnswerBuf(exam.answerPDF);
    exam.sections = parsed.sections || null;
    await idbPut(exam);
  }catch(e){
    exam.sections = null;
  }
}

async function onExamAction(action, exam, btnEl){
  if(action === "solve"){
    if(await ensurePageImages(exam)){
      await ensureSections(exam);
      openSolve(exam);
    }
  } else if(action === "del"){
    var delBtn = btnEl || null;
    if(!delBtn || delBtn.dataset.armed !== "1"){
      if(delBtn){
        delBtn.dataset.armed = "1"; delBtn.textContent = "本当に削除";
        setTimeout(function(){
          if(delBtn.isConnected){ delBtn.dataset.armed = ""; delBtn.textContent = "削除"; }
        }, 8000);
      }
      return;
    }
    await idbDelete(exam.id);
    try{ localStorage.removeItem("kyotei-marks-" + exam.id); }catch(e){}
    try{ localStorage.removeItem("kyotei-ink-" + exam.id); }catch(e){}
    try{ localStorage.removeItem("kyotei-progress-" + exam.id); }catch(e){}
    await renderLibrary();
    toast("削除しました");
  } else if(action === "regen"){
    try{
      var r = await convertExam({ qBuf: exam.questionPDF, aBuf: exam.answerPDF || null });
      exam.pageImages = r.pageImages;
      exam.pageCount = r.pageCount;
      exam.renderEngine = r.renderEngine;
      exam.answerKey = r.answerKey;
      exam.points = r.points;
      exam.sections = r.sections;
      exam.questionCount = r.questionCount;
      delete exam.generatedHTML;
      delete exam.lineCount;
      delete exam.figureCount;
      setProgress("保存中…", "");
      await idbPut(exam);
      hideProgress();
      await renderLibrary();
      toast("再生成しました（全" + r.questionCount + "問）");
    }catch(err){
      hideProgress();
      toast("再生成に失敗しました");
    }
  }
}

/* ================================================================
   解く画面： ページ画像 + タイマー + ズーム
   バーの出し入れは手動のみ（隠すボタン / メニューピル）。
   スクロール連動の自動開閉はしない。
   ================================================================ */
var solveExam = null;
var solveMarks = {};       /* {解答番号: 選んだ数字} */
var solveElapsed = 0;
var solveTimerId = null;
var solveCounting = false;    /* タイマーがカウント中か */
var solveFinished = false;    /* 採点でタイマーが止まったか（保存される） */
var solveWasCounting = false; /* 非表示になる直前にカウント中だったか */
var solveZoomIdx = 0;
var solveObjectURLs = [];
var sheetGraded = false;
var solveInk = {};            /* {ページindex: [stroke,...]} 手書き */
var solvePages = [];          /* {idx, wrap, img, canvas} */
var inkTool = null;           /* "pen" | "eraser" | null */
var inkDrawing = null;        /* 描画中: {page, stroke} | {page, erase:true} */
var ZOOMS = [50, 60, 70, 80, 90, 100, 110, 125, 150, 175, 200, 250, 300];
var ZOOM_DEFAULT_IDX = 5; /* 100% */

function marksKey(examId){ return "kyotei-marks-" + examId; }
function saveSolveState(){
  if(!solveExam) return;
  try{
    localStorage.setItem(marksKey(solveExam.id),
      JSON.stringify({ m: solveMarks, e: solveElapsed, f: solveFinished ? 1 : 0 }));
  }catch(e){}
}
function loadSolveState(examId){
  var s = null;
  try{ s = JSON.parse(localStorage.getItem(marksKey(examId)) || "null"); }catch(e){}
  solveMarks = (s && s.m) || {};
  solveElapsed = (s && s.e) || 0;
  solveFinished = !!(s && s.f);
}
function inkKey(examId){ return "kyotei-ink-" + examId; }
function saveInk(){
  if(!solveExam) return;
  try{ localStorage.setItem(inkKey(solveExam.id), JSON.stringify(solveInk)); }catch(e){}
}
function loadInk(examId){
  var s = null;
  try{ s = JSON.parse(localStorage.getItem(inkKey(examId)) || "null"); }catch(e){}
  solveInk = (s && typeof s === "object") ? s : {};
}
function drawSolveTimer(){ $("solveTimer").textContent = fmtTime(solveElapsed); }
function setCounting(on){
  solveCounting = on;
  $("btnTimerToggle").textContent = on ? "一時停止" : "再開";
}
function startSolveTimer(){
  stopSolveTimer();
  solveTimerId = setInterval(function(){
    if(!solveCounting) return;
    solveElapsed++;
    drawSolveTimer();
    if(solveElapsed % 5 === 0) saveSolveState();
  }, 1000);
}
function stopSolveTimer(){
  if(solveTimerId){ clearInterval(solveTimerId); solveTimerId = null; }
}
$("btnTimerToggle").addEventListener("click", function(){
  if(solveCounting) setCounting(false);
  else { solveFinished = false; setCounting(true); }
  saveSolveState();
});
$("btnTimerReset").addEventListener("click", function(){
  solveElapsed = 0;
  solveFinished = false;
  drawSolveTimer();
  setCounting(true);
  saveSolveState();
});
/* タブ/アプリが隠れたら自動で止める。戻ったときは、隠れる前に動いていて
   採点停止でもない場合だけ再開する */
document.addEventListener("visibilitychange", function(){
  if(!solveExam) return;
  if(document.hidden){
    solveWasCounting = solveCounting;
    if(solveCounting) setCounting(false);
    saveSolveState();
  } else {
    if(solveWasCounting && !solveFinished) setCounting(true);
    solveWasCounting = false;
  }
});

function openSolve(exam){
  solveExam = exam;
  loadSolveState(exam.id);
  loadInk(exam.id);
  sheetGraded = false;
  inkTool = null;
  inkDrawing = null;
  solveWasCounting = false;
  solveZoomIdx = ZOOM_DEFAULT_IDX;
  $("pagesInner").style.width = "100%";
  $("pagesInner").classList.remove("ink-on");
  $("btnPen").classList.remove("tool-on");
  $("btnEraser").classList.remove("tool-on");
  $("btnInkClear").hidden = true;
  $("zoomPct").textContent = "100%";
  $("solveTitle").textContent = exam.title;
  drawSolveTimer();
  /* ページ画像を並べる。各ページは img + 手書き用 canvas のラッパー。
     アプリ側がページに印を付けることはない（canvas は初期状態では空） */
  var inner = $("pagesInner");
  inner.innerHTML = "";
  solveObjectURLs.forEach(function(u){ URL.revokeObjectURL(u); });
  solveObjectURLs = [];
  solvePages = [];
  (exam.pageImages || []).forEach(function(blob, idx){
    var url = URL.createObjectURL(blob);
    solveObjectURLs.push(url);
    var wrap = document.createElement("div");
    wrap.className = "pagewrap";
    var img = document.createElement("img");
    img.src = url;
    img.alt = "";
    var canvas = document.createElement("canvas");
    canvas.className = "ink";
    wrap.appendChild(img);
    wrap.appendChild(canvas);
    inner.appendChild(wrap);
    var page = { idx: idx, wrap: wrap, img: img, canvas: canvas };
    solvePages.push(page);
    attachInkHandlers(page);
    img.addEventListener("load", function(){ syncInkCanvas(page); });
    if(img.complete && img.naturalWidth) syncInkCanvas(page);
  });
  $("pagesScroll").scrollTop = 0;
  showSolveBar(true);
  $("sheetOverlay").hidden = true;
  $("appbar").hidden = true;
  $("mainArea").hidden = true;
  $("view-solve").hidden = false;
  /* 表示されてからでないと img の実サイズが取れないため、次フレームで同期 */
  requestAnimationFrame(function(){ solvePages.forEach(syncInkCanvas); });
  setCounting(!solveFinished);
  startSolveTimer();
}
function closeSolve(){
  stopSolveTimer();
  saveSolveState();
  saveInk();
  inkTool = null;
  inkDrawing = null;
  solvePages = [];
  solveInk = {};
  solveObjectURLs.forEach(function(u){ URL.revokeObjectURL(u); });
  solveObjectURLs = [];
  $("pagesInner").innerHTML = "";
  $("pagesInner").classList.remove("ink-on");
  $("sheetOverlay").hidden = true;
  $("view-solve").hidden = true;
  $("appbar").hidden = false;
  $("mainArea").hidden = false;
  solveExam = null;
  showView("library");
}
$("solveBack").addEventListener("click", closeSolve);

/* バーの手動開閉 */
function showSolveBar(show){
  $("solveBar").hidden = !show;
  $("solveMenuPill").hidden = show;
}
$("btnHideBar").addEventListener("click", function(){ showSolveBar(false); });
$("solveMenuPill").addEventListener("click", function(){ showSolveBar(true); });

/* ズーム: －/＋で 50%〜300% を段階調整（100%未満は中央寄せ、超過分は #pagesScroll が横スクロール） */
function applyZoom(){
  var z = ZOOMS[solveZoomIdx];
  $("pagesInner").style.width = z + "%";
  $("zoomPct").textContent = z + "%";
  solvePages.forEach(syncInkCanvas);
}
$("btnZoomOut").addEventListener("click", function(){
  if(solveZoomIdx > 0){ solveZoomIdx--; applyZoom(); }
});
$("btnZoomIn").addEventListener("click", function(){
  if(solveZoomIdx < ZOOMS.length - 1){ solveZoomIdx++; applyZoom(); }
});

/* ================================================================
   手書き（ペン / 消しゴム）
   各ページの img の上に canvas を重ね、ユーザーの書き込みだけを描く。
   ストロークはページ比座標 (0..1) + 相対線幅で保持し、
   localStorage (kyotei-ink-<examId>) に保存する。
   ツールが OFF の間は canvas が pointer-events:none になり、
   通常のスクロールがそのまま効く。
   ================================================================ */
function syncInkCanvas(p){
  var w = p.img.clientWidth, h = p.img.clientHeight;
  if(!w || !h) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var bw = Math.round(w * dpr), bh = Math.round(h * dpr);
  if(p.canvas.width !== bw) p.canvas.width = bw;
  if(p.canvas.height !== bh) p.canvas.height = bh;
  redrawInk(p);
}
function redrawInk(p){
  var W = p.canvas.width, H = p.canvas.height;
  if(!W || !H) return;
  var ctx = p.canvas.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#111111";
  (solveInk[p.idx] || []).forEach(function(st){
    if(!st.pts || !st.pts.length) return;
    ctx.lineWidth = Math.max(1, st.w * W);
    ctx.beginPath();
    st.pts.forEach(function(pt, i){
      var x = pt[0] * W, y = pt[1] * H;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    if(st.pts.length === 1) ctx.lineTo(st.pts[0][0] * W + 0.01, st.pts[0][1] * H);
    ctx.stroke();
  });
}
function inkPos(p, ev){
  var r = p.canvas.getBoundingClientRect();
  if(!r.width || !r.height) return [0, 0];
  return [
    Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)),
    Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))
  ];
}
function eraseAt(p, pt){
  var strokes = solveInk[p.idx];
  if(!strokes || !strokes.length) return;
  var r = p.canvas.getBoundingClientRect();
  var tx = 14 / (r.width || 1), ty = 14 / (r.height || 1); /* 約14px を正規化 */
  var kept = strokes.filter(function(st){
    return !st.pts.some(function(q){
      var dx = (q[0] - pt[0]) / tx, dy = (q[1] - pt[1]) / ty;
      return dx * dx + dy * dy < 1;
    });
  });
  if(kept.length !== strokes.length){
    if(kept.length) solveInk[p.idx] = kept; else delete solveInk[p.idx];
    redrawInk(p);
  }
}
function attachInkHandlers(p){
  p.canvas.addEventListener("pointerdown", function(ev){
    if(!inkTool) return;
    ev.preventDefault();
    try{ p.canvas.setPointerCapture(ev.pointerId); }catch(e){}
    var pt = inkPos(p, ev);
    if(inkTool === "pen"){
      /* 線幅は「100%表示で約2.5px」をページ幅比で保持 */
      var st = { w: 2.5 / (p.img.clientWidth || 1), pts: [pt] };
      (solveInk[p.idx] = solveInk[p.idx] || []).push(st);
      inkDrawing = { page: p, stroke: st };
      redrawInk(p);
    } else {
      inkDrawing = { page: p, erase: true };
      eraseAt(p, pt);
    }
  });
  p.canvas.addEventListener("pointermove", function(ev){
    if(!inkDrawing || inkDrawing.page !== p) return;
    var pt = inkPos(p, ev);
    if(inkDrawing.stroke){
      inkDrawing.stroke.pts.push(pt);
      redrawInk(p);
    } else if(inkDrawing.erase){
      eraseAt(p, pt);
    }
  });
  function endStroke(){
    if(inkDrawing && inkDrawing.page === p){
      inkDrawing = null;
      saveInk();
    }
  }
  p.canvas.addEventListener("pointerup", endStroke);
  p.canvas.addEventListener("pointercancel", endStroke);
}
function setInkTool(tool){
  inkTool = (inkTool === tool) ? null : tool;
  inkDrawing = null;
  $("btnPen").classList.toggle("tool-on", inkTool === "pen");
  $("btnEraser").classList.toggle("tool-on", inkTool === "eraser");
  $("pagesInner").classList.toggle("ink-on", !!inkTool);
  $("btnInkClear").hidden = !inkTool;
}
$("btnPen").addEventListener("click", function(){ setInkTool("pen"); });
$("btnEraser").addEventListener("click", function(){ setInkTool("eraser"); });
$("btnInkClear").addEventListener("click", function(){
  solveInk = {};
  solvePages.forEach(redrawInk);
  saveInk();
});
window.addEventListener("resize", function(){
  solvePages.forEach(syncInkCanvas);
});

/* ================================================================
   マークシート（共テ本物の形式： 全行 1〜9 の楕円、ブロック分割）
   ================================================================ */
function blockSizes(n){
  if(n <= 0) return [];
  var blocks = Math.max(1, Math.ceil(n / 11));
  var base = Math.floor(n / blocks), rem = n % blocks;
  var sizes = [];
  for(var i = 0; i < blocks; i++) sizes.push(base + (i < rem ? 1 : 0));
  return sizes;
}
function hasKey(){
  return solveExam && Object.keys(solveExam.answerKey || {}).length > 0;
}
function pointsOf(n){
  var p = solveExam && solveExam.points ? solveExam.points[n] : null;
  return p != null ? p : 1;
}
function markedCount(){
  var c = 0;
  for(var n = 1; n <= solveExam.questionCount; n++) if(solveMarks[n]) c++;
  return c;
}

var sheetSecIdx = 0;
function showSection(i){
  sheetSecIdx = i;
  document.querySelectorAll("#msBlocks .msblock[data-sec]").forEach(function(b){
    b.style.display = parseInt(b.getAttribute("data-sec"), 10) === i ? "" : "none";
  });
  document.querySelectorAll("#secNav button").forEach(function(b, bi){
    b.classList.toggle("on", bi === i);
  });
  $("sheetOverlay").scrollTop = 0;
}

function buildSheet(){
  var exam = solveExam;
  $("sheetTitle").textContent = exam.title;
  $("scoreBanner").className = "";
  $("scoreBanner").innerHTML = "";
  $("sheetGrade").hidden = !hasKey();
  $("sheetExport").hidden = true;
  var wrap = $("msBlocks");
  wrap.innerHTML = "";
  var nav = $("secNav");
  nav.innerHTML = "";
  function makeBlock(from, to, secIdx){
    var block = document.createElement("div");
    block.className = "msblock";
    if(secIdx != null) block.setAttribute("data-sec", secIdx);
    var head = document.createElement("div");
    head.className = "msgrid head";
    var h = '<div class="hc num">番号</div>';
    for(var d = 1; d <= 9; d++) h += '<div class="hc">' + d + "</div>";
    h += "<div></div>";
    head.innerHTML = h;
    block.appendChild(head);
    for(var n = from; n <= to; n++){
      var row = document.createElement("div");
      row.className = "msgrid msrow";
      row.setAttribute("data-row", n);
      var rh = '<div class="rno">' + n + "</div>";
      for(var v = 1; v <= 9; v++){
        rh += '<button class="bubble" data-n="' + n + '" data-v="' + v + '" aria-label="問'
          + n + " 選択肢" + v + '"><span class="ov">' + v + "</span></button>";
      }
      rh += '<div class="res" data-res="' + n + '"></div>';
      row.innerHTML = rh;
      block.appendChild(row);
    }
    return block;
  }
  var secs = (exam.sections && exam.sections.length >= 2) ? exam.sections : null;
  if(secs){
    nav.hidden = false;
    secs.forEach(function(s, i){
      var b = document.createElement("button");
      b.innerHTML = s.label + '<span class="secprog" data-secprog="' + i + '"></span>';
      b.addEventListener("click", function(){ showSection(i); });
      nav.appendChild(b);
      wrap.appendChild(makeBlock(s.from, s.to, i));
    });
    showSection(0);
  } else {
    nav.hidden = true;
    var start = 1;
    blockSizes(exam.questionCount).forEach(function(size){
      wrap.appendChild(makeBlock(start, start + size - 1, null));
      start += size;
    });
  }
  wrap.querySelectorAll(".bubble").forEach(function(b){
    b.addEventListener("click", function(){
      var n = parseInt(b.getAttribute("data-n"), 10);
      var v = parseInt(b.getAttribute("data-v"), 10);
      if(solveMarks[n] === v) delete solveMarks[n];
      else solveMarks[n] = v;
      if(sheetGraded) clearGrading();
      paintRow(n);
      updateUnmarked();
      saveSolveState();
    });
  });
  for(var q = 1; q <= exam.questionCount; q++) paintRow(q);
  updateUnmarked();
}
function paintRow(n){
  document.querySelectorAll('.bubble[data-n="' + n + '"]').forEach(function(b){
    var v = parseInt(b.getAttribute("data-v"), 10);
    b.classList.toggle("filled", solveMarks[n] === v);
  });
}
function updateUnmarked(){
  var un = solveExam.questionCount - markedCount();
  $("unmarkedLine").textContent = un > 0
    ? "未マーク " + un + "問（全" + solveExam.questionCount + "問）"
    : "全" + solveExam.questionCount + "問 マーク済み";
  var secs = solveExam.sections;
  if(secs && secs.length >= 2){
    secs.forEach(function(s, i){
      var el = document.querySelector('[data-secprog="' + i + '"]');
      if(!el) return;
      var c = 0;
      for(var n = s.from; n <= s.to; n++) if(solveMarks[n]) c++;
      el.textContent = c + "/" + (s.to - s.from + 1);
    });
  }
}
function clearGrading(){
  sheetGraded = false;
  $("scoreBanner").className = "";
  $("scoreBanner").innerHTML = "";
  $("sheetExport").hidden = true;
  document.querySelectorAll("[data-res]").forEach(function(el){ el.textContent = ""; el.className = "res"; });
  document.querySelectorAll(".bubble.correct-hint").forEach(function(b){ b.classList.remove("correct-hint"); });
}

function openSheet(){
  if(!solveExam) return;
  sheetGraded = false;
  buildSheet();
  $("sheetOverlay").hidden = false;
  $("sheetOverlay").scrollTop = 0;
}
function closeSheet(){
  $("sheetOverlay").hidden = true;
  saveSolveState();
}
$("btnSheet").addEventListener("click", openSheet);
$("sheetClose").addEventListener("click", closeSheet);
$("sheetOverlay").addEventListener("click", function(e){
  if(e.target === this) closeSheet();
});

/* ---------- 採点 ---------- */
function gradeSheet(){
  if(!solveExam || !hasKey()) return;
  var key = solveExam.answerKey;
  var total = 0, max = 0;
  for(var n = 1; n <= solveExam.questionCount; n++){
    if(key[n] == null) continue;
    max += pointsOf(n);
    if(solveMarks[n] === key[n]) total += pointsOf(n);
  }
  for(var q = 1; q <= solveExam.questionCount; q++){
    var res = document.querySelector('[data-res="' + q + '"]');
    if(!res) continue;
    res.className = "res";
    res.textContent = "";
    document.querySelectorAll('.bubble[data-n="' + q + '"]').forEach(function(b){
      b.classList.remove("correct-hint");
    });
    if(key[q] == null) continue;
    if(!solveMarks[q]){ res.textContent = "－"; res.classList.add("blank"); }
    else if(solveMarks[q] === key[q]){ res.textContent = "○"; res.classList.add("ok"); }
    else {
      res.textContent = "×"; res.classList.add("ng");
      var correctBtn = document.querySelector(
        '.bubble[data-n="' + q + '"][data-v="' + key[q] + '"]');
      if(correctBtn) correctBtn.classList.add("correct-hint");
    }
  }
  sheetGraded = true;
  solveFinished = true;   /* 採点したらタイマーは止める（再開は手動ボタン） */
  setCounting(false);
  var banner = $("scoreBanner");
  banner.innerHTML = '得点 <span class="big">' + total + '</span> <small>/ ' + max + " 点</small>";
  banner.className = "show";
  $("sheetExport").hidden = false;
  saveSolveState();
  toast("採点しました：" + total + " / " + max + "点");
}
$("sheetGrade").addEventListener("click", gradeSheet);

/* ---------- 解答を出力 ---------- */
function buildExportText(){
  var exam = solveExam;
  var key = exam.answerKey || {};
  var lines = [exam.title];
  var head;
  if(sheetGraded && hasKey()){
    var total = 0, max = 0;
    for(var n = 1; n <= exam.questionCount; n++){
      if(key[n] == null) continue;
      max += pointsOf(n);
      if(solveMarks[n] === key[n]) total += pointsOf(n);
    }
    head = "得点 " + total + " / " + max + "点";
  } else head = "未採点";
  head += "　回答済み " + markedCount() + " / " + exam.questionCount
    + "問　経過時間 " + fmtTime(solveElapsed);
  lines.push(head);
  var wrong = [], unans = [];
  for(var q = 1; q <= exam.questionCount; q++){
    var mine = solveMarks[q] ? String(solveMarks[q]) : "未回答";
    if(!solveMarks[q]) unans.push(q);
    if(hasKey() && key[q] != null){
      var mark = !solveMarks[q] ? "-" : (solveMarks[q] === key[q] ? "○" : "×");
      if(solveMarks[q] && solveMarks[q] !== key[q]) wrong.push(q);
      lines.push("問" + q + ": 自分の解答 " + mine + " / 正解 " + key[q]
        + " / " + mark + " / " + pointsOf(q) + "点");
    } else {
      lines.push("問" + q + ": 自分の解答 " + mine);
    }
  }
  if(hasKey()) lines.push("間違えた問題: " + (wrong.length ? wrong.join(", ") : "なし"));
  lines.push("未回答: " + (unans.length ? unans.join(", ") : "なし"));
  return lines.join("\n");
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      function(){ toast("解答をコピーしました"); },
      function(){ toast("コピーできませんでした"); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("解答をコピーしました"); }
    catch(e){ toast("コピーできませんでした"); }
    ta.remove();
  }
}
$("sheetExport").addEventListener("click", function(){
  var text = buildExportText();
  if(navigator.share){
    navigator.share({ text: text }).catch(function(err){
      if(err && err.name !== "AbortError") copyText(text);
    });
  } else copyText(text);
});

/* ================================================================
   取り込み
   ================================================================ */
var impQFile = null, impAFile = null;
function resetImport(){
  impQFile = null; impAFile = null;
  $("impTitle").value = "";
  $("impQName").textContent = "";
  $("impAName").textContent = "";
  $("impQ").value = ""; $("impA").value = "";
  $("impQUrl").value = ""; $("impAUrl").value = "";
  $("impAClear").hidden = true;
  $("impError").textContent = "";
}
async function fetchPdfBuffer(url){
  var res = await fetch(url);
  if(!res.ok) throw new Error("URLから取得できませんでした（" + res.status + "）");
  var buf = await res.arrayBuffer();
  var head = new Uint8Array(buf.slice(0, 4));
  if(!(head[0] === 0x25 && head[1] === 0x50 && head[2] === 0x44 && head[3] === 0x46)){
    throw new Error("URLの先がPDFではありませんでした");
  }
  return buf;
}
function urlFileName(url){
  try{
    var p = new URL(url).pathname.split("/").pop() || "";
    return decodeURIComponent(p).replace(/\.pdf$/i, "");
  }catch(e){ return ""; }
}
$("btnNew").addEventListener("click", function(){ resetImport(); showView("import"); });
$("impCancel").addEventListener("click", function(){ showView("library"); });
$("impQ").addEventListener("change", function(){
  impQFile = this.files && this.files[0] ? this.files[0] : null;
  $("impQName").textContent = impQFile ? impQFile.name : "";
  if(impQFile) $("impQUrl").value = "";
  if(impQFile && !$("impTitle").value){
    $("impTitle").value = impQFile.name.replace(/\.pdf$/i, "");
  }
});
$("impA").addEventListener("change", function(){
  impAFile = this.files && this.files[0] ? this.files[0] : null;
  $("impAName").textContent = impAFile ? impAFile.name : "";
  if(impAFile) $("impAUrl").value = "";
  $("impAClear").hidden = !(impAFile || $("impAUrl").value);
});
$("impQUrl").addEventListener("input", function(){
  if(this.value){ impQFile = null; $("impQ").value = ""; $("impQName").textContent = ""; }
});
$("impAUrl").addEventListener("input", function(){
  if(this.value){ impAFile = null; $("impA").value = ""; $("impAName").textContent = ""; }
  $("impAClear").hidden = !(impAFile || this.value);
});
$("impAClear").addEventListener("click", function(){
  impAFile = null;
  $("impA").value = "";
  $("impAUrl").value = "";
  $("impAName").textContent = "";
  $("impAClear").hidden = true;
});
$("impStart").addEventListener("click", async function(){
  $("impError").textContent = "";
  var qUrl = $("impQUrl").value.replace(/^\s+|\s+$/g, "");
  var aUrl = $("impAUrl").value.replace(/^\s+|\s+$/g, "");
  if(!impQFile && !qUrl){
    $("impError").textContent = "問題PDFを選ぶか、URLを入力してください。";
    return;
  }
  var title = $("impTitle").value.replace(/^\s+|\s+$/g, "")
    || (impQFile ? impQFile.name.replace(/\.pdf$/i, "") : urlFileName(qUrl))
    || "模試";
  try{
    var qBuf, aBuf = null;
    if(impQFile){
      setProgress("PDFを読み込んでいます…", "");
      qBuf = await impQFile.arrayBuffer();
    }else{
      setProgress("URLから問題PDFを取得しています…", "");
      try{ qBuf = await fetchPdfBuffer(qUrl); }
      catch(fe){ throw new Error("問題PDFをURLから取得できませんでした。サイト側が許可していない可能性があります。ファイルをダウンロードして選んでください。"); }
    }
    if(impAFile){
      aBuf = await impAFile.arrayBuffer();
    }else if(aUrl){
      setProgress("URLから解答PDFを取得しています…", "");
      try{ aBuf = await fetchPdfBuffer(aUrl); }
      catch(fe){ throw new Error("解答PDFをURLから取得できませんでした。サイト側が許可していない可能性があります。ファイルをダウンロードして選んでください。"); }
    }
    var r = await convertExam({ qBuf: qBuf, aBuf: aBuf });
    var exam = {
      id: newId(), title: title, createdAt: Date.now(),
      questionCount: r.questionCount,
      pageImages: r.pageImages, pageCount: r.pageCount, renderEngine: r.renderEngine,
      answerKey: r.answerKey, points: r.points, sections: r.sections,
      questionPDF: qBuf, answerPDF: aBuf
    };
    setProgress("保存中…", "");
    await idbPut(exam);
    hideProgress();
    await renderLibrary();
    showView("library");
    var keyCount = Object.keys(r.answerKey).length;
    toast(keyCount
      ? "取り込みました（全" + r.questionCount + "問・正解 " + keyCount + "問分）"
      : "取り込みました（正解は未設定です）");
  }catch(err){
    hideProgress();
    $("impError").textContent = "変換に失敗しました：" + (err && err.message ? err.message : err);
  }
});

/* ---- 初期化 / Service Worker ---- */
renderLibrary();
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function(){});
  });
}
