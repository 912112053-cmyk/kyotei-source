<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MuPDF load test</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
<script src="convert.js"></script>
</head>
<body>
<h1>MuPDF load test</h1>
<pre id="out">starting…</pre>
<div id="imgs"></div>
<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
(async function(){
  var M = null;
  try{
    log("importing mupdf module…");
    M = await import("https://cdn.jsdelivr.net/npm/mupdf@1.28.6/dist/mupdf.js");
    log("import OK. exports: " + Object.keys(M).slice(0, 20).join(","));
  }catch(e){
    log("IMPORT FAILED: " + (e && e.message || e));
    log("stack: " + (e && e.stack || ""));
    log("DONE");
    return;
  }
  try{
    var buf = await (await fetch("test-question.pdf")).arrayBuffer();
    log("pdf bytes=" + buf.byteLength);
    var doc = M.Document.openDocument(buf, "application/pdf");
    log("doc opened. pages=" + doc.countPages());
    var page = doc.loadPage(1); /* page 2 (0-based) — the pdf.js-blank page */
    var zoom = 200 / 72;
    var pix = page.toPixmap(M.Matrix.scale(zoom, zoom), M.ColorSpace.DeviceRGB, false);
    log("pixmap: " + pix.getWidth() + "x" + pix.getHeight() + " samples=" + pix.getNumberOfComponents());
    var W = pix.getWidth(), H = pix.getHeight(), px = pix.getPixels(), n = pix.getNumberOfComponents();
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");
    var img = ctx.createImageData(W, H);
    var stride = pix.getStride ? pix.getStride() : W * n;
    for(var y = 0; y < H; y++){
      for(var x = 0; x < W; x++){
        var si = y * stride + x * n, di = (y * W + x) * 4;
        img.data[di] = px[si]; img.data[di+1] = px[si+1]; img.data[di+2] = px[si+2];
        img.data[di+3] = n >= 4 ? px[si+3] : 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    document.getElementById("imgs").appendChild(canvas);
    var worker = await Tesseract.createWorker("jpn");
    var ocr = await KyoteiConvert.ocrImage(worker, canvas, W, H);
    await worker.terminate();
    log("OCR page2 via MuPDF: lines=" + ocr.lines.length + " words=" + ocr.words.length);
    log("first: " + ocr.lines.slice(0,3).map(function(l){ return l.text; }).join(" | "));
    log("DONE");
  }catch(e){
    log("RENDER FAILED: " + (e && e.message || e));
    log("stack: " + (e && e.stack || ""));
    log("DONE");
  }
})();
</script>
</body>
</html>
