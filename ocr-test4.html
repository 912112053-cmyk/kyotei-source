<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>App MuPDF code verbatim test</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
<script src="convert.js"></script></head>
<body><h1>App MuPDF code verbatim test</h1><pre id="out">starting…</pre><div id="imgs"></div>
<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
var RENDER_SCALE = 200 / 72;
var MUPDF_MODULE_URL = "https://cdn.jsdelivr.net/npm/mupdf@1.28.6/dist/mupdf.js";
var mupdfMod = null;
var mupdfModulePromise = null;
function loadMuPDF(){
  if(mupdfMod) return Promise.resolve(mupdfMod);
  if(!mupdfModulePromise){
    mupdfModulePromise = import(MUPDF_MODULE_URL).then(function(mod){
      mupdfMod = mod;
      return mod;
    });
    /* 失敗したら次回再試行できるようにキャッシュを捨てる */
    mupdfModulePromise.catch(function(){ mupdfModulePromise = null; });
  }
  return mupdfModulePromise;
}
/* ArrayBuffer → MuPDF Document。失敗時は throw (呼び出し側で fallback) */
async function openMuPDFDoc(buf){
  var mupdf = await loadMuPDF();
  return mupdf.Document.openDocument(new Uint8Array(buf.slice(0)), "application/pdf");
}
/* MuPDF でページを 200dpi 相当に描画して canvas を返す (同期処理) */
function renderMuPDFPageToCanvas(muDoc, pageIndex){
  var page = muDoc.loadPage(pageIndex);
  try{
    var pixmap = page.toPixmap(
      mupdfMod.Matrix.scale(RENDER_SCALE, RENDER_SCALE),
      mupdfMod.ColorSpace.DeviceRGB, false);
    try{
      var w = pixmap.getWidth(), h = pixmap.getHeight();
      var n = pixmap.getNumberOfComponents();
      var hasAlpha = pixmap.getAlpha();
      var stride = pixmap.getStride();
      var px = pixmap.getPixels();
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d", { willReadFrequently: true });
      var img = ctx.createImageData(w, h);
      var out = img.data;
      for(var y = 0; y < h; y++){
        var srow = y * stride, drow = y * w * 4;
        for(var x = 0; x < w; x++){
          var s = srow + x * n, d = drow + x * 4;
          out[d] = px[s]; out[d + 1] = px[s + 1]; out[d + 2] = px[s + 2];
          out[d + 3] = hasAlpha ? px[s + 3] : 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      return canvas;
    } finally { pixmap.destroy(); }
  } finally { page.destroy(); }
}


(async function(){
  try{
    var buf = await (await fetch("test-question.pdf")).arrayBuffer();
    var muDoc = null;
    try { muDoc = await openMuPDFDoc(buf); log("openMuPDFDoc OK, pages=" + muDoc.countPages()); }
    catch(e){ log("openMuPDFDoc THREW: " + (e && e.message || e)); log("DONE"); return; }
    var canvas = null;
    try { canvas = renderMuPDFPageToCanvas(muDoc, 1); }
    catch(e){ log("render THREW: " + (e && e.message || e)); log("stack: " + (e && e.stack || "")); log("DONE"); return; }
    if(!canvas){ log("render returned null"); log("DONE"); return; }
    log("canvas: " + canvas.width + "x" + canvas.height);
    document.getElementById("imgs").appendChild(canvas);
    var worker = await Tesseract.createWorker("jpn");
    var ocr = await KyoteiConvert.ocrImage(worker, canvas, canvas.width, canvas.height);
    await worker.terminate();
    log("OCR: lines=" + ocr.lines.length + " words=" + ocr.words.length);
    log("DONE");
  }catch(e){ log("ERROR: " + (e && e.message || e)); log("DONE"); }
})();
</script></body></html>
